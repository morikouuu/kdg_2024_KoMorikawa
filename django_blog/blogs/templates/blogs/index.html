{% extends '../base.html' %} {% block content %}
<head>
	<title>ブログ管理サイト</title>
</head>
<form action='{% url "blogs:index" %}' method="get" style="margin-top: 80px;">

	<div class="form-group">
		{{ searchForm }}
		<input type="submit" class="btn btn-outline-primary" value="OK" />
		<a href="{% url 'blogs:index' %}" class="btn btn-outline-primary">クリア</a>
	</div>
</form>
<h1 style="text-align: center">My Blog</h1>

<div style="width: 70%; margin: 0px auto" class="card">
		{% for blog in blogs %}
			<div class="card-body">
				<h3 class="card-title">{{ blog.title }}</h3>
				<div class="card-text" >{{ blog.text | truncatechars:100 }}</div>
				<div style="text-align: right">
					<a href ="{% url 'blogs:detail' pk=blog.id %}" class="card-link">記事を読む</a>
				</div>
			</div>
			
		{% endfor %}
	</table>
		<div>
			<a href="{% url 'blogs:create' %}" class='btn btn-outline-primary'>新規</a>
		</div>
</div>
{% endblock %}
